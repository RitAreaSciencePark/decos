{% extends "base.html" %}
{% load static %}

{% block body_class %}template-thankyou{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/custom_cards.css' %}">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-center">
          <h3 class="mb-0">{{ page.thankyou_page_title|default:"Thank You!" }}</h3>
        </div>
        <div class="card-body text-center">
          <p class="lead">Thank you for submitting your data.</p>
          <p class="text-muted">Data has been recorded successfully.</p>
          <a href="/" class="btn btn-primary mt-3">Return to Homepage</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
